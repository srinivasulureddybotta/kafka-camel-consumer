# ─────────────────────────────────────
# Camel
# ─────────────────────────────────────
camel.springboot.name=KafkaCamelConsumer
# Keep the app alive (non-web Spring Boot app)
camel.springboot.main-run-controller=true

# ─────────────────────────────────────
# Kafka – Connection
# ─────────────────────────────────────
kafka.brokers=localhost:9092

# ─────────────────────────────────────
# Kafka – Consumer Topic & Group
# ─────────────────────────────────────
kafka.input.topic=my-input-topic
kafka.consumer.group=my-consumer-group

# ─────────────────────────────────────
# Parallelism Settings
# ─────────────────────────────────────
# Number of Kafka consumer threads (should not exceed partition count)
kafka.consumers.count=5

# Minimum threads in the processing thread pool (threads() DSL)
kafka.thread.pool.min=5

# Maximum threads in the processing thread pool (threads() DSL)
kafka.thread.pool.max=20

# ─────────────────────────────────────
# Kafka – Auto Offset / Commit
# ─────────────────────────────────────
kafka.auto.offset.reset=earliest
# Disable auto-commit — Camel handles offset commits after processing
kafka.enable.auto.commit=false

# ─────────────────────────────────────
# Dead Letter Queue
# ─────────────────────────────────────
kafka.dlq.topic=my-dlq-topic

# ─────────────────────────────────────
# Error Handling – Redelivery
# ─────────────────────────────────────
error.max.redeliveries=3
error.redelivery.delay.ms=2000
error.backoff.multiplier=2.0

# ─────────────────────────────────────
# Logging
# ─────────────────────────────────────
logging.level.com.example.kafka=DEBUG
logging.level.org.apache.camel=INFO
